<!doctype html>
<html><body>
<!-- extracto real de https://www.bdi.com.do/ (3 nov 2026) -->
<script>
 function ChangeRateDollarSell(input) {
 var amount = parseInt(input.value);
 var dolarValue = parseFloat(61.50);
 var number = (amount * dolarValue).toFixed(2);
 var formatted = (amount * dolarValue).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
 document.getElementById('rd-venta').value =formatted;
 }
 function ChangeRateDollarBuy(input) {
 var amount = parseInt(input.value);

 var formatted = (amount * dolarValue).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
 document.getElementById('rd-compra').value = formatted;
 }
